spring.application.name=estudio-agentes
server.port=8080

# Banco H2 em memória (troque por PostgreSQL/MySQL em produção; só os DAOs conhecem SQL)
spring.datasource.url=jdbc:h2:mem:estudio;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.h2.console.enabled=true

# Origem do frontend em desenvolvimento (CORS e WebSocket)
estudio.allowed-origins=http://localhost:4200
# Velocidade da simulação de trabalho dos agentes (ms entre passos)
estudio.simulacao.passo-ms=700

# ---------------------------------------------------------------------------
# Execução dos agentes
#   cli      -> chama a ferramenta oficial de cada provedor (usa a SUA assinatura/login)
#   simulado -> só animação, nada é gerado
estudio.runner.mode=cli
# Onde cada projeto ganha a sua pasta (ex.: ~/estudio-projetos/site-de-e-commerce-12)
estudio.runner.workspace=${user.home}/estudio-projetos
# Tempo máximo de cada agente numa tarefa
estudio.runner.timeout-min=20
# Se o provedor do agente não estiver instalado (ex.: agentes CLAUDE sem o Claude Code), usa este
estudio.runner.fallback-provider=OPENAI

# Comandos (argumentos separados por |). O prompt é enviado pelo stdin.
estudio.cli.openai=codex|exec|--skip-git-repo-check|--sandbox|workspace-write|-
estudio.cli.gemini=gemini|--approval-mode|auto_edit|--skip-trust|-p|Siga as instrucoes acima.
estudio.cli.claude=claude|-p|--permission-mode|acceptEdits|Siga as instrucoes acima.

# O que o time aprendeu (tela Conhecimento): arquivos .md que entram no pedido de cada agente
estudio.conhecimento.dir=${user.home}/estudio-conhecimento
# Baixa a legenda dos vídeos do YouTube (instale: https://github.com/yt-dlp/yt-dlp)
estudio.ytdlp=yt-dlp
